<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11143a">
  <title>ShiftMate</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShiftMate">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <!-- First-run welcome -->
  <section id="welcome" class="auth" hidden>
    <div class="theme-pick auth-theme" role="radiogroup" aria-label="Theme"></div>
    <div class="auth-brand">
      <div class="logo-tile" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
      <h1>ShiftMate</h1>
      <p>Your shifts, reminders and hours, right on your phone.</p>
    </div>
    <div class="auth-card">
      <form id="welcome-form" novalidate>
        <label class="field"><span>Your first name</span><input name="name" autocomplete="given-name" maxlength="40" required></label>
        <fieldset class="type-pick">
          <legend>I am a…</legend>
          <label class="type-opt"><input type="radio" name="type" value="student">
            <span><b>Student</b><small>Limited to 20 hours a week</small></span></label>
          <label class="type-opt"><input type="radio" name="type" value="worker" checked>
            <span><b>Worker</b><small>No weekly hour limit</small></span></label>
        </fieldset>
        <p class="form-error" id="welcome-error" role="alert"></p>
        <button class="btn primary block">Get started</button>
        <p class="small muted" style="text-align:center;margin:.8rem 0 0">Everything stays on this phone. No account needed.</p>
      </form>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <nav class="nav" aria-label="Main">
      <div class="nav-brand"><span class="logo-tile small" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span> ShiftMate</div>
      <a href="#home" data-nav="home"></a>
      <a href="#schedule" data-nav="schedule"></a>
      <a href="#hours" data-nav="hours"></a>
      <a href="#settings" data-nav="settings"></a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div id="sheet-body"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toasts" aria-live="polite"></div>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
